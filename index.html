<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payoo MFS</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <main class="flex justify-center">
    <div class="mockup-phone">
  <div class="mockup-phone-camera"></div>
  <div class="mockup-phone-display text-black grid place-content-center bg-sky-50">

    <!-- Login section  -->

     <div class="hero min-h-screen">
  <div class="hero-content flex-col">
    
    <div class="card bg-base-100 w-full max-w-4xl shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Mobile Number</label>
          <input id="phone-number" type="tel" class="input" placeholder="Enter Your Number" autocomplete="off" required />
          <label class="label">4 Digit Pin</label>
          <input type="password" class="input" placeholder="Enter 4 Digit Pin" required />
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="btn-login" class="btn bg-sky-600 text-white rounded-4xl mt-4">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
  </div>
</div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
