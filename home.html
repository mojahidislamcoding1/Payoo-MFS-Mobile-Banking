<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Home Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="flex justify-center">
      <div class="mockup-phone">
        <div class="mockup-phone-camera"></div>
        <div
          class="mockup-phone-display text-black grid place-content-center bg-slate-50"
        >
          <!-- available balance  -->
          <div>
            <div class="stats shadow">
              <div class="stat">
                <div id="balance" class="stat-value">$9400</div>
                <div class="stat-desc ">Avialable Balance</div>
              </div>
            </div>
          </div>
           <div class="divider w-96"></div>

           <!-- user action button  -->
            <div>
              <button id="btn-show-addMoney" class="btn btn-xl">+ Add Money</button>
              <button id="btn-show-cashOut" class="btn btn-xl">- Cash Out</button>
            
            </div>
            <div class="divider"></div>
            <!-- add money form start -->

             <div class=" flex justify-center">
            <div id="add-money-form" class=" shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl ">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Amount</label>
          <input id="amount" type="text" class="input" placeholder="Amount" autocomplete="off"  />
          <label class="label">Pin</label>
          <input id="pin-number" type="password" class="input" placeholder="Enter Pin" required />
          <div><a class="link link-hover">Forget Pin</a></div>
          <button id="btn-addMoney" class="btn bg-sky-600 text-white rounded-4xl mt-4">+ Add Money</button>
        </fieldset>
      </div>
    </div>    
  </div>
   <!-- add money form end  -->

   <!-- cash out start  -->
            <div class="flex justify-center">
            <div id="cash-out-form" class="hidden shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl ">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Amount</label>
          <input id="cash-out-amount" type="text" class="input" placeholder="Amount" autocomplete="off"  />
          <label class="label">Pin</label>
          <input id="cash-out-pin" type="password" class="input" placeholder="Enter Pin" required />
          <div><a class="link link-hover">Forget Pin</a></div>
          <button id="btn-cashOut" class="btn bg-sky-600 text-white rounded-4xl mt-4"> - Cash Out</button>
        </fieldset>
      </div>
    </div>    
  </div>
    <!-- cash out end  -->

        </div>
      </div>
    </main>
    <script src="js/utilities.js"></script>
    <script src="js/cash-out.js"></script>
    <script src="js/add-money.js"></script>
    <script src="js/features.js"></script>
  </body>
</html>
