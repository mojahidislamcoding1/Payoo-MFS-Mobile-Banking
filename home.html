<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Home Page</title>
    <link rel="stylesheet" href="style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="flex justify-center">
      <div class="mockup-phone">
        <div class="mockup-phone-camera"></div>
        <div
          class="mockup-phone-display text-black grid place-content-center bg-slate-50"
        >
          <!-- available balance  -->
          <div>
            <div class="stats shadow mx-6 mt-4">
              <div class="stat flex flex-row">
                <div><img src="assets/Group.png" alt="" class="h-12"/></div>
                <div>
                  <div id="balance" class="stat-value h-10 ">$9400</div>
                  <div class="stat-desc text-sm font-bold text-gray-600">
                    Avialable Balance
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="divider w-full"></div>
          <!-- payoo heading and about  -->

          <div>
            <h3 class="text-xl font-bold ml-4">🔥 Welcome to Payooo!</h3>
            <p class="text-sm font-medium ml-4">
              Enjoy easy and convenient financial services with us. Cashout
              charge is low and
            </p>
          </div>

          <div class="divider w-full"></div>
          <!--divider-->
          <!-- user action button  -->
          <div class="space-y-4 ml-4">
            <button id="btn-show-addMoney" class="btn btn-xl py-4">
              <img src="assets/wallet1.png" alt="" />Add Money
            </button>
            <button id="btn-show-cashOut" class="btn btn-xl py-4">
              <img src="assets/send1.png" alt="" /> Cash Out
            </button>
            <button id="btn-show-transaction" class="btn btn-xl py-4">
              <img src="assets/transaction1.png" alt="" /> Transaction
            </button>
            <button id="btn-show-payBill" class="btn btn-xl py-4">
              <img src="assets/purse1.png" alt="" />Pay Bil
            </button>
            <button id="btn-show-transferMoney" class="btn btn-xl py-4">
              <img src="assets/money1.png" alt="" />Transfer Money
            </button>
            <button id="btn-show-bonus" class="btn btn-xl py-4">
              <img src="assets/bonus1.png" alt="" />Get Bonus
            </button>
          </div>
          <div class="divider"></div>
          <!-- add money form start -->

          <div class="flex justify-center">
            <div
              id="add-money-form"
              class="hidden shado shrink-0 max-h-screen card bg-white rounded-lg w-96"
            >
              <h2 class="font-bold ml-4 mt-4">Add Money</h2>
              <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label">Amount</label>
                  <input
                    id="amount"
                    type="text"
                    class="input"
                    placeholder="Amount"
                    autocomplete="off"
                  />
                  <label class="label">Pin</label>
                  <input
                    id="pin-number"
                    type="password"
                    class="input"
                    placeholder="Enter Pin"
                    required
                  />
                  <div><a class="link link-hover">Forget Pin</a></div>
                  <button
                    id="btn-addMoney"
                    class="btn bg-sky-600 text-white rounded-4xl mt-4"
                  >
                    + Add Money
                  </button>
                </fieldset>
              </div>
            </div>
          </div>
          <!-- add money form end  -->

          <!-- cash out start  -->
          <div class="flex justify-center">
            <div
              id="cash-out-form"
              class="hidden shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl"
            >
              <h2 class="font-bold ml-4 mt-4">Cash Out</h2>
              <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label">Amount</label>
                  <input
                    id="cash-out-amount"
                    type="text"
                    class="input"
                    placeholder="Amount"
                    autocomplete="off"
                  />
                  <label class="label">Pin</label>
                  <input
                    id="cash-out-pin"
                    type="password"
                    class="input"
                    placeholder="Enter Pin"
                    required
                  />
                  <div><a class="link link-hover">Forget Pin</a></div>
                  <button
                    id="btn-cashOut"
                    class="btn bg-sky-600 text-white rounded-4xl mt-4"
                  >
                    - Cash Out
                  </button>
                </fieldset>
              </div>
            </div>
          </div>
          <!-- cash out end  -->

          <!-- transfer money form starts  -->
          <div class="flex justify-center">
            <div
              id="transferMoney-form"
              class="hidden shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl"
            >
              <h2 class="font-bold ml-4 mt-4">Transfer Money</h2>
              <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label">Account Number</label>
                  <input
                    id="Account-Number"
                    type="text"
                    class="input"
                    placeholder="Enter 11 Digit Number"
                    autocomplete="off"
                  />
                  <label class="label">Amount</label>
                  <input
                    id="transferMoney-amount"
                    type="text"
                    class="input"
                    placeholder="Amount"
                    autocomplete="off"
                  />
                  <label class="label">Pin</label>
                  <input
                    id="transferMoney-pin"
                    type="password"
                    class="input"
                    placeholder="Enter Pin"
                    required
                  />

                  <button
                    id="btn-transferMoney"
                    class="btn bg-sky-600 text-white rounded-4xl mt-4"
                  >
                    Send Now
                  </button>
                </fieldset>
              </div>
            </div>
          </div>
          <!-- transfer money form End  -->

            <!-- Get Bonus html starts  -->
           <div class="flex justify-center">
            <div
              id="GetBonus-form"
              class="hidden shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl"
            >
              <h2 class="font-bold ml-4 mt-4">Get Bonus</h2>
              <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label">Enter Bonus Cupon"</label>
                  <input
                    id="Bonus-Cupon"
                    type="text"
                    class="input"
                    placeholder="Enter Bonus Cupon"
                    autocomplete="off"
                  />
                  <button
                    id="btn-getBonus"
                    class="btn bg-sky-600 text-white rounded-4xl mt-4"
                  >
                    Get Bonus
                  </button>
                </fieldset>
              </div>
            </div>
          </div>
            <!-- Get Bonus html End  -->

          <!-- Transaction  starts  -->
          <div id="transaction-section" class="hidden">
            <h2 class="text-2xl text-center mb-3">Transaction History</h2>
            <div id="transaction-container" class="space-y-3 px-4"></div>
          </div>
          <!-- Transaction form End  -->

          <!-- Pay Bill section starts  -->
             <div class="flex justify-center">
            <div
              id="PayBill-form"
              class="hidden shadow-xl shrink-0 max-h-screen card bg-gray-200 w-96 max-w-4xl"
            >
              <h2 class="font-bold ml-4 mt-4">Transfer Money</h2>
              <div class="card-body">
                <fieldset class="fieldset">
                  <select name="" id="bill-type">
                    <option value="" disabled selected>Select One </option>
                    <option value="palli-bidyat">Palli Bidwat </option>
                    <option value="internet-bill">Internet Bill </option>
                    <option value="gas-bill">Gas Bill </option>
                    <option value="water-bill">Water Bill </option>
                  </select>
                  <label class="label">Billar Account Number</label>
                  <input
                    id="Account-Number"
                    type="text"
                    class="input"
                    placeholder="Enter Account Number"
                    autocomplete="off"
                  />
                  <label class="label">Amount to Pay</label>
                  <input
                    id="PayBill-amount"
                    type="text"
                    class="input"
                    placeholder="Amount"
                    autocomplete="off"
                  />
                  <label class="label">Pin Number</label>
                  <input
                    id="payBill-pin"
                    type="password"
                    class="input"
                    placeholder="Enter Pin"
                    required
                  />

                  <button
                    id="btn-PayBill"
                    class="btn bg-sky-600 text-white rounded-4xl mt-4"
                  >
                    Pay Bill
                  </button>
                </fieldset>
              </div>
            </div>
          </div>
          <!-- Pay Bill section End  -->
        </div>
      </div>
    </main>
    <script src="js/utilities.js"></script>
    <script src="js/cash-out.js"></script>
    <script src="js/add-money.js"></script>
    <script src="js/features.js"></script>
    <script src="js/transfer-money.js"></script>
    <script src="js/getBonus.js"></script>
    <script src="js/payBill.js"></script>
  </body>
</html>
